name: Release
on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with: { node-version: "20" }
            - name: Build
              run: npm ci && npm run build
            - uses: actions/attest-build-provenance@v2
              with: { subject-path: "main.js"}
            - name: Create Release
              env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
              run: awk '/^## /{if(p)exit; p=1} p' CHANGELOG.md > release-notes && gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --notes-file release-notes